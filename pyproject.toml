[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "huaien"
version = "0.5.0"
description = "怀恩 — 极简前台管家界面。背后是本机 Hermes Agent 的独立人格。"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["hermes", "agent", "gui", "tkinter", "minimal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Natural Language :: Chinese (Simplified)",
]
dependencies = []

[project.optional-dependencies]
# 运行时零第三方依赖 —— huaien 包只用标准库 (tkinter 是标准库的一部分)。
# 所以 `pip install huaien` 之后前台能直接跑, 不会 ModuleNotFound。
#
# ⚠️ PyYAML / psutil 必须**显式声明** —— 曾经它们是靠
#    PYTHONPATH 蹭到 Hermes 环境的包, 一旦把 PYTHONPATH 清干净
#    (huaien/runtime.py 干的就是这事) 就会 ModuleNotFoundError。
#    依赖声明必须完整, 不能靠运行环境兜底。
dev = ["pytest>=8", "ruff>=0.6", "Pillow>=10", "PyYAML>=6", "psutil>=5"]

# 截图 / 自检 / drill 需要 Pillow。
# 前台的截图走**子进程** import PIL (huaien/app.py 的 _shot), 缺 Pillow 时
# 只会打印 "[SHOT] 失败" 并跳过 —— 不会崩, 但截图就没了。
# 想要截图功能就装这个组: pip install "huaien[screenshot]"
screenshot = ["Pillow>=10"]

[project.scripts]
huaien = "huaien.app:main"

[tool.hatch.build.targets.wheel]
packages = ["huaien"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# 自检/看门狗脚本要能直接跑, 顶层脚本放宽导入顺序
"scripts/*.py" = ["E402"]
