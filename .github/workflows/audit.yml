# 敏感信息审计 —— 远端强制闸
#
# 用户 2026-11-04: "防止下次更新到github时, 又把敏感信息公布出去"
#
# 本地 pre-commit 钩子只保护这台机器; **这个 CI 保护所有人** ——
# 任何人 fork / PR 进来, 敏感值进不了仓库。
#
# 关键点:
# - fetch-depth: 0  必须 —— 默认浅克隆只有 1 个 commit, 审计历史会全漏
# - windows-latest  必须 —— 脚本里的规则含 Windows 路径形态
name: 敏感信息审计

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    # ⚠️ **Windows 上 Python 输出中文/emoji 走 GBK 编码** ——
    #    stdout 被重定向成管道时直接 UnicodeEncodeError 崩溃 (rc=1)。
    #    本地设了 PYTHONIOENCODING=utf-8 所以看不出来, CI 上必炸。
    #    这里设 UTF-8 模式, 不用依赖命令行参数。
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: 检出 (全量历史)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 探针 (确认 python 是哪个)
        shell: pwsh
        run: |
          # ⚠️ **不要用裸 `python`** —— Windows 上它可能解析到 Microsoft Store
          #    的存根 (python.exe 占位符), 瞬间返回 9009 而不报错。
          #    setup-python 注入的路径在 bash 里也不可靠, 所以用 pwsh + 显式路径。
          $py = Join-Path $env:pythonLocation 'python.exe'
          if (-not (Test-Path $py)) { $py = 'python' }
          {
            Write-Host "pythonLocation: $env:pythonLocation"
            Write-Host "resolved: $py"
            & $py -c "import sys; print('sys.executable:', sys.executable); print('version:', sys.version)"
            Write-Host "rc: $LASTEXITCODE"
          } 2>&1 | Tee-Object -FilePath probe_out.txt

      - name: 跑敏感信息审计
        # ⚠️ 三重输出, 保证失败原因**不用登录 GitHub 也能看到**:
        #    ① stdout (CI 日志)
        #    ② GITHUB_STEP_SUMMARY (网页上可见)
        #    ③ commit status description (API 匿名可读) —— 见下面一步
        #    用 bash (Windows 自带 Git Bash), tee 同时写 stdout 和文件。
        shell: pwsh
        run: |
          $py = Join-Path $env:pythonLocation 'python.exe'
          if (-not (Test-Path $py)) { $py = 'python' }
          & $py -X utf8 scripts/audit_publish.py 2>&1 |
            Tee-Object -FilePath audit_out.txt
          # ⚠️ pwsh 里管道会吞掉退出码 —— 必须用 $LASTEXITCODE。
          $rc = $LASTEXITCODE
          "exit_code=$rc" | Out-File -FilePath audit_out.txt -Append -Encoding utf8
          # 用 ::error:: 把 fatal 明细变成 **check annotation** ——
          # annotations API 匿名可读 (不用登录就能看 CI 为什么红)。
          if ($rc -ne 0) {
            Select-String -Path audit_out.txt -Pattern '\[.+?\]|统计|exit_code' |
              ForEach-Object { "::error::$($_.Line.Trim())" }
          }
          exit $rc

      - name: 静态检查
        run: |
          python -m pip install --quiet ruff
          python -m ruff check .
